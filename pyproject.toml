[project]
name = "snapquiz"
version = "0.0.1"
description = "个人学习刷题助手:热键截屏 → 视觉大模型(GLM-4.6V-Flash)→ 答案+解析"
requires-python = ">=3.10"
dependencies = [
    # 直接 POST Adapter 准备好的确切字节；用 SDK 会重新序列化，
    # 「预览到的」就无法保证等于「发出的」。
    "httpx>=0.27",
    "mss>=9.0",          # 屏幕截取
    "python-dotenv>=1.0",
    # macOS 全局热键 / 权限自检(仅 macOS)
    "pyobjc-framework-Carbon>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0 ; sys_platform == 'darwin'",
]

[project.scripts]
snapquiz = "snapquiz.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 打包成 SnapQuiz.app（不签名）
app = ["py2app>=0.28", "pynput>=1.7"]
# 真·全局热键(--trigger hotkey);macOS 上需授予「辅助功能」权限
hotkey = ["pynput>=1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snapquiz*"]
